 internet connection?",a:"No. The app does not declare the INTERNET permission, so it cannot use the internet at all. Messages travel over Bluetooth, and larger files can use Wi-Fi Direct, which is a direct phone-to-phone link and not an internet connection."},{q:"How do devices discover one another?",a:"GhostChat advertises and scans over Bluetooth Low Energy, and nearby devices appear on the Nearby screen. Tap Connect to open a Bluetooth Classic connection. Android will ask for Bluetooth, location, nearby Wi-Fi devices and notification permissions."},{q:"Which Android devices are supported?",a:"Android 8.0 (API 26) or newer with Bluetooth Low Energy. The app also declares Wi-Fi Direct support for file transfers. No tested-device list has been published, and there is no iOS or Windows app."},{q:"What happens when a device disconnects?",a:"The app retries the connection with backoff, and messages stay QUEUED. When the link returns, queued and failed messages are resent oldest first. Encryption keys are dropped on disconnect and a new handshake runs on reconnect."},{q:"Are messages queued when a recipient is unavailable?",a:"Yes. Every message is saved first as QUEUED, then moves through SENDING and SENT. It becomes DELIVERED only when the other device returns an authenticated receipt. A write failure marks it FAILED, and it is retried on the next reconnect."},{q:"Does GhostChat use end-to-end encryption?",a:"The v1.0 code does: a signed ECDH key exchange, then AES-256-GCM for text, receipts and file chunks. It has not been audited, and the app cannot yet show you a contact's fingerprint, so you cannot confirm who is on the other end. The older README still says encryption is missing; the code is newer. See the security section."},{q:"Is mesh messaging currently available?",a:'It is built but experimental. The code includes route discovery, hop-limited relaying, signed route origins and mesh acknowledgements, and the chat screen can show "Connected via mesh" with a h
